# nginx config for the static Kingdom's Kids site.
# nginx-unprivileged image runs as UID 101 and binds 8080.
# Traefik (Dokploy) terminates TLS in front of this container.

server {
    listen       8080;
    server_name  _;
    server_tokens off;

    # Traefik terminates TLS and owns the public host/port — don't let nginx
    # invent host/port in 30x redirects.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Content-Security-Policy ─────────────────────────────────────────
    # add_header does NOT support `\` continuations — build the value with
    # `set` and concatenate, or the browser sees a directive named `\`.
    #
    # Self-contained site: GSAP is bundled to /_astro (served from 'self'),
    # the font is a local woff2, SVGs are inlined, no CDNs, no analytics.
    #   script 'unsafe-inline' — Astro's tiny inline bootstrap shims.
    #   style  'unsafe-inline' — Astro inlines critical CSS; GSAP writes
    #                            inline styles at runtime.
    set $csp_default "default-src 'self'";
    set $csp_script  "script-src 'self' 'unsafe-inline'";
    set $csp_style   "style-src 'self' 'unsafe-inline'";
    set $csp_img     "img-src 'self' data: blob:";
    set $csp_font    "font-src 'self' data:";
    set $csp_connect "connect-src 'self'";
    set $csp_manifest "manifest-src 'self'";
    set $csp_object  "object-src 'none'";
    set $csp_frame_a "frame-ancestors 'none'";
    set $csp_base    "base-uri 'self'";
    set $csp_form    "form-action 'self'";
    set $csp_misc    "upgrade-insecure-requests";
    set $csp "${csp_default}; ${csp_script}; ${csp_style}; ${csp_img}; ${csp_font}; ${csp_connect}; ${csp_manifest}; ${csp_object}; ${csp_frame_a}; ${csp_base}; ${csp_form}; ${csp_misc}";
    add_header Content-Security-Policy $csp always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml application/javascript application/json
        application/ld+json application/manifest+json application/rss+xml
        application/vnd.ms-fontobject application/x-font-ttf
        application/xhtml+xml application/xml font/opentype
        image/bmp image/svg+xml image/x-icon text/cache-manifest
        text/css text/plain text/vcard text/vtt text/x-component;

    # ── Cache rules ─────────────────────────────────────────────────────
    # Hashed build assets — long-lived, immutable.
    location ~* ^/_astro/.*\.(js|css|woff2|woff|ttf|svg|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # HTML — never cache; revalidate every visit.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /robots.txt  { expires 1d; access_log off; log_not_found off; }
    location = /favicon.ico { expires 1d; access_log off; log_not_found off; }

    # ── Routing (single static page) ────────────────────────────────────
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Deny hidden / sensitive files.
    location ~ /\.(?!well-known) { deny all; }
    location ~ /\.git            { deny all; }
}
