# App-specific rules layered on ghcr.io/robyrew/static-web.
# Blocks that set their own header must re-include the security headers, because
# nginx add_header discards inherited ones.
location = /robots.txt  { expires 1d; access_log off; log_not_found off; }
location = /favicon.ico { expires 1d; access_log off; log_not_found off; }
